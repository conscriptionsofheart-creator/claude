<!doctype html><meta charset="utf-8"><body style="margin:0;background:#1a1622"><script type="importmap">{"imports":{"three":"/pe_lib/bst_three_0.186.1.module.js"}}</script><script type="module">
/* dev only: three engines over the in-page relay. Ruth and Sam build the emblem together by hand (rods, heads, joined); a third headset watches, and this is what it sees: both of them as avatars,
   each in their own look, and the shared piece. Everything is made through the engines' own tools and the shared order. */
const T = await import('/pe_lib/bst_three_0.186.1.module.js'), eng = await import('/pe_lib/sculpt_next_engine.js?' + Date.now()), { makeLocalRelay } = await import('/pe_lib/sculpt_next_collab.js'), { EMBLEM } = await import('/pe_lib/sculpt_next_emblem.js');
const V3 = T.Vector3, Q = T.Quaternion, relay = makeLocalRelay();
const r = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(900, 620); r.outputColorSpace = T.SRGBColorSpace; document.body.appendChild(r.domElement);
const studio = () => { const env = new T.Scene(), sky = new T.Mesh(new T.SphereGeometry(5, 32, 16), new T.MeshBasicMaterial({ side: T.BackSide, vertexColors: true })), P = sky.geometry.attributes.position, C = new Float32Array(P.count * 3); for (let i = 0; i < P.count; i++) { const k = 0.5 + 0.5 * P.getY(i) / 5; C.set([0.25 + 0.7 * k, 0.22 + 0.68 * k, 0.3 + 0.7 * k], i * 3); } sky.geometry.setAttribute('color', new T.BufferAttribute(C, 3)); env.add(sky); const l = new T.Mesh(new T.BoxGeometry(2, 0.2, 2), new T.MeshBasicMaterial({ color: 0xffffff })); l.position.set(0, 4, 0); env.add(l); return new T.PMREMGenerator(r).fromScene(env, 0.04).texture; };
const envTex = studio(), lookFrom = (eye, at) => new Q().setFromRotationMatrix(new T.Matrix4().lookAt(eye, at, new V3(0, 1, 0)));
const mk = (name, head, at) => { const world = new T.Scene(); world.background = new T.Color(0x1a1622); world.environment = envTex; world.add(new T.HemisphereLight(0xffffff, 0x443355, 0.6)); const d = new T.DirectionalLight(0xffffff, 1.5); d.position.set(0.6, 2, 1.5); world.add(d);
  const floor = new T.Mesh(new T.CircleGeometry(2.2, 64), new T.MeshStandardMaterial({ color: 0x2a2433, roughness: 0.9 })); floor.rotation.x = -Math.PI / 2; floor.name = '_floor'; world.add(floor);
  const pose = { p: head.clone(), q: lookFrom(head, at) }; const vs = eng.createVrSculpt(T, null, { setBench() {}, say() {}, figure: () => null, props: () => [], noWorker: true, addObject: o => { if (!o.parent) world.add(o); }, removeObject: o => { if (o.parent) o.parent.remove(o); }, head: () => ({ p: pose.p.clone(), q: pose.q.clone() }) });
  vs.enter(null); vs.set.stabilize(0); return { name, vs, world, pose }; };
const O = new V3(-0.05, 1.08, -0.55), sc = 0.5 / 1180, toW = p => new V3((p[0] - 625) * sc, (640 - p[1]) * sc, p[2] * sc).add(O);
const A = mk('Ruth', new V3(-0.5, 1.62, -0.25), O.clone().add(new V3(-0.05, 0.1, 0))), B = mk('Sam', new V3(0.48, 1.6, -0.35), O.clone().add(new V3(0.05, 0.1, 0))), C = mk('Watcher', new V3(0.1, 1.5, 1.3), O);
const tick = () => new Promise(res => setTimeout(res, 0)), settle = async () => { for (let k = 0; k < 3000; k++) { await tick(); [A, B, C].forEach(p => p.vs.flush()); if (relay.idle() && [A, B, C].every(p => p.vs.together.waiting === 0)) { await tick(); if (relay.idle()) return; } } };
A.vs.set.avatarLook('pearl'); A.vs.set.avatarGradient('emblem blue'); B.vs.set.avatarLook('glow'); B.vs.set.avatarGradient('sunset');
for (const p of [A, B, C]) { p.vs.together.start({ transport: relay.connect(), name: p.name }); await settle(); }
const hand = (id, tip, pinch) => ({ id, tip: tip.clone(), dir: new V3(0, 0, -1), quat: new Q(), pinch });
const along = (pts, n) => { const w = pts.map(toW), L = [0]; for (let i = 1; i < w.length; i++) L.push(L[i - 1] + w[i].distanceTo(w[i - 1])); return Array.from({ length: n }, (_, k) => { const d = L[L.length - 1] * k / (n - 1); let i = 1; while (i < L.length - 1 && L[i] < d) i++; return w[i - 1].clone().lerp(w[i], (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1)); }); };
const blue = EMBLEM.parts[0], orange = EMBLEM.parts[2], bh = EMBLEM.parts[1], oh = EMBLEM.parts[3], pa = along(blue.pts, 70), pb = along(orange.pts, 70);
A.vs.set.mode('rod'); A.vs.set.gradient('emblem blue'); A.vs.set.size(blue.wide * sc * 50); A.vs.set.rodTwist(180); B.vs.set.mode('rod'); B.vs.set.gradient('emblem orange'); B.vs.set.size(orange.wide * sc * 50); B.vs.set.rodTwist(180);
for (let i = 0; i < 72; i++) { A.vs.frame(i < 70 ? [hand('r', pa[i], true)] : [], 0.016); B.vs.frame(i < 70 ? [hand('r', pb[i], true)] : [], 0.016); C.vs.frame([], 0.016); await tick(); }
await settle(); A.vs.set.mode('ball'); B.vs.set.mode('ball');
const head = (part, i) => { const c = toW(part.c), rr = part.r * sc; return i < 8 ? c.clone().add(new V3(rr * i / 7, 0, 0)) : c.clone().add(new V3(rr, 0, 0)); };
for (let i = 0; i < 10; i++) { A.vs.frame([hand('r', head(bh, i), i < 8)], 0.016); B.vs.frame([hand('r', head(oh, i), i < 8)], 0.016); C.vs.frame([], 0.016); await tick(); }
await settle(); A.vs.joinPieces(); await settle();
/* they stay reaching toward their work while the watcher looks: Ruth's hand on the blue head, Sam's on the orange body */
const ra = toW(bh.c).add(new V3(-0.03, -0.02, 0.05)), rb = pb[36].clone().add(new V3(0.03, 0, 0.04)), la = new V3(-0.62, 1.1, -0.45);
for (let i = 0; i < 90; i++) { A.vs.frame([hand('r', ra, false), hand('l', la, false)], 0.016); B.vs.frame([hand('r', rb, false)], 0.016); C.vs.frame([], 0.016); await tick(); }
const cam = new T.PerspectiveCamera(38, 900 / 620, 0.01, 20); cam.position.copy(C.pose.p).add(new V3(0, 0.05, 0.2)); cam.lookAt(O.clone().add(new V3(0, 0.12, -0.1))); r.render(C.world, cam);
window.__result = { same: [A, B, C].map(p => p.vs.together.checksum()), avatarsSeen: C.vs.together.avatars().map(a => a.kind + ':' + a.look), pieces: C.vs.assets().map(a => a.kind) };
</script>
