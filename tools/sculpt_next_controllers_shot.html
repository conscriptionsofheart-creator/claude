{ const g = new T.BufferGeometry().setFromPoints([ray.o, ray.o.clone().addScaledVector(ray.d, ray.o.distanceTo(P.panel.localToWorld(new V3())) * 1.02)]); scene.add(new T.Line(g, new T.LineBasicMaterial({ color: 0xe0975a }))); }
