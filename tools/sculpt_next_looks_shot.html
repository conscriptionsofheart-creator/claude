<!doctype html><meta charset="utf-8"><body style="margin:0;background:#1a1622"><script type="importmap">{"imports":{"three":"/pe_lib/bst_three_0.186.1.module.js"}}</script><script type="module">
/* dev only: a picture of the colour wheel and some dressed pieces, made with the engine's own tools (fake hand frames), for checking by eye */
const T = await import('/pe_lib/bst_three_0.186.1.module.js'), eng = await import('/pe_lib/sculpt_next_engine.js?' + Date.now()), V3 = T.Vector3, Q = T.Quaternion;
const scene = new T.Scene(); scene.background = new T.Color(0x1a1622);
const r = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(900, 600); r.outputColorSpace = T.SRGBColorSpace; document.body.appendChild(r.domElement);
/* a soft studio for reflections (the Atelier has its own room light) */
const env = new T.Scene(), sky = new T.Mesh(new T.SphereGeometry(5, 32, 16), new T.MeshBasicMaterial({ side: T.BackSide, vertexColors: true })), P = sky.geometry.attributes.position, C = new Float32Array(P.count * 3);
for (let i = 0; i < P.count; i++) { const y = P.getY(i) / 5, k = 0.5 + 0.5 * y; C[i * 3] = 0.25 + 0.7 * k; C[i * 3 + 1] = 0.22 + 0.68 * k; C[i * 3 + 2] = 0.3 + 0.7 * k; } sky.geometry.setAttribute('color', new T.BufferAttribute(C, 3)); env.add(sky);
const lamp = new T.Mesh(new T.BoxGeometry(2, 0.2, 2), new T.MeshBasicMaterial({ color: 0xffffff })); lamp.position.set(0, 4, 0); env.add(lamp);
scene.environment = new T.PMREMGenerator(r).fromScene(env, 0.04).texture;
scene.add(new T.HemisphereLight(0xffffff, 0x443355, 0.6)); const d = new T.DirectionalLight(0xffffff, 1.6); d.position.set(0.6, 2, 1.5); scene.add(d);
const says = [], vs = eng.createVrSculpt(T, null, { setBench() {}, say: t => says.push(t), figure: () => null, props: () => [], addObject: o => { if (!o.parent) scene.add(o); }, removeObject: o => { if (o.parent) o.parent.remove(o); }, noWorker: true });
vs.enter(null); vs.set.stabilize(0);
const hand = (tip, pinch) => ({ id: 'r', tip: tip.clone(), dir: new V3(0, 0, -1), quat: new Q(), pinch });
const run = pts => { pts.forEach(p => vs.frame([hand(p, true)], 0.016)); vs.frame([hand(pts[pts.length - 1], false)], 0.016); vs.flush(); };
const tap = p => run([p, p]);
const curve = (x0, y0, n, f) => Array.from({ length: n }, (_, i) => f(i / (n - 1))).map(([x, y, z]) => new V3(x0 + x, y0 + y, -0.6 + z));
/* rods in four gradients, one see-through, then skins and looks on them */
const G = [['sunset', 'smooth', 'gloss'], ['ocean', 'marble', 'pearl'], ['custom', 'smooth', 'glass'], ['gold', 'wood', 'chrome']];
vs.set.gradCustom('#ff2a6d@0,#7a3cff@0.5,#05d9e8@1'); vs.set.size(2.2); vs.set.rodTwist(270);
G.forEach(([g, skin, look], k) => {
  vs.set.gradient(g); vs.set.mode('rod'); const x0 = -0.42 + k * 0.2, pts = curve(x0, 1.1, 40, t => [Math.sin(t * Math.PI) * 0.06, t * 0.38, Math.cos(t * 3) * 0.04]); run(pts);
  if (g === 'custom') { vs.set.gradCustom('#ff2a6d@0,#7a3cff@0.5,#05d9e822@1'); vs.set.mode('gradient'); run([pts[0], pts[10], pts[20], pts[39]]); }
  if (skin !== 'smooth') { vs.set.skin(skin); vs.set.gradient(g); vs.set.mode('gradient'); tap(pts[20]); vs.set.skin('smooth'); }
  vs.set.finish(look); vs.set.alpha(look === 'glass' ? 0.6 : 1); vs.set.mode('look'); tap(pts[20]);
});
/* balls: rainbow, candy velvet, emblem orange glow */
[['rainbow', 'satin'], ['candy', 'velvet'], ['emblem orange', 'gloss']].forEach(([g, look], k) => { vs.set.gradient(g); vs.set.mode('ball'); const c = new V3(-0.36 + k * 0.17, 1.62, -0.6); run([c, c.clone().add(new V3(0.045, 0, 0))]); vs.set.finish(look); vs.set.alpha(1); vs.set.mode('look'); tap(c.clone().add(new V3(0.045, 0, 0))); });
/* the wheel, open, with a gradient being built */
vs.set.gradient('custom'); vs.set.gradCustom('#ff2a6d@0,#ffd319@0.45,#05d9e8@1'); vs.set.rgb('#ffd319'); vs.set.alpha(0.8);
vs.wheel.open(new V3(0.38, 1.38, -0.55), new V3(0.3, 1.4, 0.6));
const cam = new T.PerspectiveCamera(36, 1.5, 0.01, 10); cam.position.set(0.05, 1.38, 0.55); cam.lookAt(0.05, 1.36, -0.6); r.render(scene, cam);
window.__result = { assets: vs.assets().map(a => a.kind + ':' + [].concat(a.object.material || []).map(m => m.userData.look || m.type).join()).join(' '), says: says.slice(-4) };
</script>
